# =========================================================
# RunTrash · Despliegue en Render
# =========================================================
# Este archivo permite desplegar con un solo clic en Render.
# La base de datos y las claves se configuran en el panel de
# Render (Environment), NO se escriben aquí.
#
# Documentación paso a paso: DEPLOY.md
# =========================================================

services:
  - type: web
    name: runtrash
    runtime: node
    plan: free
    region: ohio
    rootDir: .
    buildCommand: npm install --prefix servidor
    startCommand: npm run start:prod --prefix servidor
    healthCheckPath: /api/prueba
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Obligatorio: la URL de Neon o Supabase
      - key: DATABASE_URL
        sync: false
      # El frontend se sirve desde este mismo servicio
      - key: FRONTEND_DIR
        value: /opt/render/project/src
      # Necesario para que los limites de peticiones funcionen detras del proxy
      - key: TRUST_PROXY
        value: "true"
      # La clave del administrador (8+ caracteres, con letras y números)
      - key: ADMIN_NAME
        value: Administrador RunTrash
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Opcional: ingreso con Google y Outlook (OAuth 2.0).
      # Deja los secretos vacíos para ocultar los botones OAuth.
      - key: OAUTH_BASE_URL
        sync: false
      - key: OAUTH_STATE_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      # El envio de correo no esta implementado. No expongas el codigo
      # de recuperacion en produccion: permitiria tomar cuentas ajenas.
      - key: EXPOSER_CODIGO_RECUPERACION
        value: "false"
      # Las fotos NO se deben guardar en el disco de Render (es temporal).
      # Pon estos 3 valores de Neon Object Storage para que persistan.
      - key: STORAGE_PROVIDER
        value: s3
      - key: STORAGE_S3_ENDPOINT
        sync: false
      - key: STORAGE_S3_BUCKET
        value: uploads
      - key: STORAGE_S3_REGION
        value: us-east-2
      - key: STORAGE_S3_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_S3_SECRET_ACCESS_KEY
        sync: false
