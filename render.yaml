# =========================================================
# RunTrash · Despliegue en Render
# =========================================================
# Este archivo permite desplegar con un solo clic en Render.
# La base de datos y las claves se configuran en el panel de
# Render (Environment), NO se escriben aquí.
#
# Solo se piden TRES valores al desplegar:
#   DATABASE_URL, ADMIN_EMAIL y ADMIN_PASSWORD
#
# Google/Outlook y el almacenamiento de fotos son opcionales: se
# activan después desde Render > Environment cuando el dueño tenga
# sus credenciales reales.
#
# Documentación paso a paso: DEPLOY.md
# =========================================================

services:
  - type: web
    name: runtrash
    runtime: node
    plan: free
    region: ohio
    rootDir: .
    buildCommand: npm install --prefix servidor
    startCommand: npm run start:prod --prefix servidor
    healthCheckPath: /api/prueba
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Obligatorio: la URL de Neon o Supabase
      - key: DATABASE_URL
        sync: false
      # El frontend se sirve desde este mismo servicio
      - key: FRONTEND_DIR
        value: /opt/render/project/src
      # Necesario para que los limites de peticiones funcionen detras del proxy
      - key: TRUST_PROXY
        value: "true"
      # La clave del administrador (8+ caracteres, con letras y números)
      - key: ADMIN_NAME
        value: Administrador RunTrash
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # El envio de correo no esta implementado. No expongas el codigo
      # de recuperacion en produccion: permitiria tomar cuentas ajenas.
      - key: EXPOSER_CODIGO_RECUPERACION
        value: "false"
      # Cuentas de demostracion (OPCIONAL). Si lo activas, se crean las
      # cuentas @runtrash.test con contrasenas conocidas. Usalo solo
      # para una demostracion y desactivalo despues.
      #   SEED_DEMO_ACCOUNTS=true
      # Credenciales: ver DEPLOY.md, seccion "Cuentas de demostracion".
      # Las fotos se guardan en el disco local de Render. Es temporal:
      # se pierden en cada redespliegue. Para que persistan, agrega en
      # Render > Environment estas variables de Neon Object Storage:
      #   STORAGE_PROVIDER=s3
      #   STORAGE_S3_ENDPOINT=...
      #   STORAGE_S3_BUCKET=uploads
      #   STORAGE_S3_REGION=us-east-2
      #   STORAGE_S3_ACCESS_KEY_ID=...
      #   STORAGE_S3_SECRET_ACCESS_KEY=...
      #
      # Ingreso con Google y Outlook (opcional). Cuando tengas las
      # credenciales reales, agrega en Render > Environment:
      #   OAUTH_BASE_URL=https://TU-SERVICIO.onrender.com
      #   OAUTH_STATE_SECRET=<cadena larga y aleatoria>
      #   GOOGLE_CLIENT_ID=...
      #   GOOGLE_CLIENT_SECRET=...
      #   MICROSOFT_CLIENT_ID=...
      #   MICROSOFT_CLIENT_SECRET=...
